<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Planificador Taller Rodi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f1f5f9;min-height:100vh}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div id="app" style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:16px;color:#64748b">Cargando...</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyAku229brCi0uaqdWtjABkrkKgijXhr-yk",
  authDomain:"alm-243-rodi.firebaseapp.com",
  databaseURL:"https://alm-243-rodi-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"alm-243-rodi",
  storageBucket:"alm-243-rodi.firebasestorage.app",
  messagingSenderId:"225425074223",
  appId:"1:225425074223:web:faaca35eb22da1248abeda"
});
var db=firebase.database();

var MECANICOS=[
  {id:1,nombre:"Jordi",color:"#2563eb"},
  {id:2,nombre:"James",color:"#7c3aed"},
  {id:3,nombre:"Javi",color:"#0891b2"},
  {id:4,nombre:"Joni",color:"#16a34a"},
  {id:5,nombre:"Curti",color:"#d97706"},
  {id:6,nombre:"Pau",color:"#dc2626"}
];
var COLORES=["#1d4ed8","#7c3aed","#0e7490","#15803d","#b45309","#b91c1c","#be185d","#0369a1","#4338ca","#065f46"];
var FRANJAS=[];
for(var h=8;h<=18;h++) FRANJAS.push((h<10?'0':'')+h+':00');
var DIAS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
var MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

var coches={},asignaciones={},conectado=false;
var hoy=new Date().getDay();
var semana=getISOWeek(new Date());
var diaActivo;
if(hoy>=1&&hoy<=5){
  diaActivo=hoy-1;
} else {
  // Sábado o domingo -> ir al lunes de la semana siguiente
  semana=semana+1;
  diaActivo=0;
}
var modal=null,modalCocheId=null,colorIdx=0,modalTipo='particular',modalRentingEmpresa='';

function getISOWeek(d){
  var date=new Date(d);date.setHours(0,0,0,0);
  date.setDate(date.getDate()+3-((date.getDay()+6)%7));
  var w1=new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date-w1)/86400000-3+((w1.getDay()+6)%7))/7);
}
function getLunes(isoWeek){
  var jan4=new Date(2026,0,4);
  var l1=new Date(jan4);
  l1.setDate(jan4.getDate()-((jan4.getDay()+6)%7));
  var l=new Date(l1);
  l.setDate(l1.getDate()+(isoWeek-1)*7);
  return l;
}
function addDays(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
function dateKey(d){return d.toISOString().slice(0,10);}
function getKey(mecId,date,franja){return mecId+'_'+dateKey(date)+'_'+franja.replace(':','');}
function formatEntrega(dt){
  if(!dt)return '';
  var d=new Date(dt);
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function isVencido(dt){return dt&&new Date(dt)<new Date();}

db.ref('coches').on('value',function(s){coches=s.val()||{};render();});
db.ref('asignaciones').on('value',function(s){asignaciones=s.val()||{};render();});
db.ref('.info/connected').on('value',function(s){conectado=!!s.val();render();});

function agregarCoche(){
  var mat=document.getElementById('inp-mat').value.trim().toUpperCase();
  var mod=document.getElementById('inp-mod').value.trim()||'Sin modelo';
  if(!mat)return;
  var id=Date.now();
  db.ref('coches/'+id).set({id:id,matricula:mat,modelo:mod,color:COLORES[colorIdx%COLORES.length]});
  colorIdx++;
  document.getElementById('inp-mat').value='';
  document.getElementById('inp-mod').value='';
}
function eliminarCoche(id){
  if(!confirm('¿Seguro que quieres eliminar este vehículo? También se borrarán sus tareas asignadas.'))return;
  db.ref('coches/'+id).remove();
  Object.keys(asignaciones).forEach(function(k){if(asignaciones[k].cocheId==id)db.ref('asignaciones/'+k).remove();});
}
function abrirModal(mecId,dateStr,franja){
  var k=getKey(mecId,new Date(dateStr+'T12:00:00'),franja);
  var asig=asignaciones[k];
  modal={mecId:mecId,dateStr:dateStr,franja:franja,editando:!!asig,key:k};
  modalCocheId=asig?asig.cocheId:null;
  modalTipo=asig&&asig.tipo?asig.tipo:'particular';
  modalRentingEmpresa=asig&&asig.rentingEmpresa?asig.rentingEmpresa:'';
  render();
  setTimeout(function(){
    if(asig){
      var dl=document.getElementById('modal-llave');if(dl)dl.value=asig.llave||'';
      var dd=document.getElementById('modal-desc');if(dd)dd.value=asig.descripcion||'';
      var de=document.getElementById('modal-entrega');if(de&&asig.entrega)de.value=asig.entrega;
    }
    var el=document.getElementById('modal-llave');if(el)el.focus();
  },50);
}
function setTipo(t){
  modalTipo=t;
  var el=document.getElementById('modal-renting');
  if(el)modalRentingEmpresa=el.value;
  render();
  setTimeout(function(){var e=document.getElementById('modal-renting');if(e)e.focus();},50);
}
function selCoche(id){
  modalCocheId=id;render();
  setTimeout(function(){var el=document.getElementById('modal-llave');if(el)el.focus();},50);
}
function guardar(){
  if(!modal||!modalCocheId)return;
  var desc=document.getElementById('modal-desc').value.trim();
  if(!desc)return;
  var llave=document.getElementById('modal-llave').value.trim()||'';
  var entrega=document.getElementById('modal-entrega').value||'';
  var rentingEl=document.getElementById('modal-renting');
  var rentingEmpresa=rentingEl?rentingEl.value.trim():'';
  var k=getKey(modal.mecId,new Date(modal.dateStr+'T12:00:00'),modal.franja);
  var asigActual=asignaciones[k]||{};
  db.ref('asignaciones/'+k).set({
    cocheId:modalCocheId,
    descripcion:desc,
    llave:llave,
    entrega:entrega,
    tipo:modalTipo,
    rentingEmpresa:modalTipo==='renting'?rentingEmpresa:'',
    llaveRecibida:asigActual.llaveRecibida||false,
    llaveNumero:asigActual.llaveNumero||'',
    materialPreparado:asigActual.materialPreparado||false
  });
  modal=null;render();
}
function eliminarAsig(mecId,dateStr,franja){
  if(!confirm('¿Seguro que quieres eliminar esta tarea?'))return;
  var k=getKey(mecId,new Date(dateStr+'T12:00:00'),franja);
  db.ref('asignaciones/'+k).remove();
}
function toggleLlave(mecId,dateStr,franja,val){
  var k=getKey(mecId,new Date(dateStr+'T12:00:00'),franja);
  if(val){
    // Si ya está activado, desactivar
    db.ref('asignaciones/'+k+'/llaveRecibida').set(false);
    db.ref('asignaciones/'+k+'/llaveNumero').set('');
  } else {
    var num=prompt('Número de llave recibida:');
    if(num===null)return;
    db.ref('asignaciones/'+k+'/llaveRecibida').set(true);
    db.ref('asignaciones/'+k+'/llaveNumero').set(num.trim());
  }
}
function toggleMaterial(mecId,dateStr,franja,val){
  var k=getKey(mecId,new Date(dateStr+'T12:00:00'),franja);
  db.ref('asignaciones/'+k+'/materialPreparado').set(!val);
}
function toggleComida(mecId,dateStr,franja){
  var k=getKey(mecId,new Date(dateStr+'T12:00:00'),franja);
  var asig=asignaciones[k];
  if(asig&&asig.comida){
    db.ref('asignaciones/'+k).remove();
  } else {
    db.ref('asignaciones/'+k).set({comida:true});
  }
}
function marcarComida(){
  if(!modal)return;
  var k=getKey(modal.mecId,new Date(modal.dateStr+'T12:00:00'),modal.franja);
  db.ref('asignaciones/'+k).set({comida:true});
  modal=null;render();
}
function onDragStart(ev,k){
  ev.dataTransfer.setData('text/plain',k);
  ev.dataTransfer.effectAllowed='copyMove';
}
function onDrop(ev,mecId,dateStr,franja){
  ev.preventDefault();
  var srcKey=ev.dataTransfer.getData('text/plain');
  if(!srcKey)return;
  var destKey=getKey(mecId,new Date(dateStr+'T12:00:00'),franja);
  if(srcKey===destKey)return;
  var srcData=asignaciones[srcKey];
  if(!srcData)return;
  // Si destino ya ocupado, no hacer nada
  if(asignaciones[destKey])return;
  db.ref('asignaciones/'+destKey).set(srcData);
  if(!ev.ctrlKey){
    db.ref('asignaciones/'+srcKey).remove();
  }
}
function onDragOver(ev){ev.preventDefault();}
function cerrarModal(){modal=null;render();}
function cambiarSemana(d){semana=Math.min(Math.max(semana+d,1),52);render();}
function irAHoy(){
  var d=new Date().getDay();
  semana=getISOWeek(new Date());
  if(d>=1&&d<=5){diaActivo=d-1;}
  else {semana=semana+1;diaActivo=0;}
  render();
}

function render(){
  var lunes=getLunes(semana);
  var dias=[0,1,2,3,4].map(function(i){return addDays(lunes,i);});
  var diaActual=dias[diaActivo];
  var diaStr=dateKey(diaActual);
  var COL=80,CW=128,CH=62;
  var cochesArr=Object.values(coches);

  var html='<div style="display:flex;flex-direction:column;height:100vh;overflow:hidden">';

  // Header
  html+='<div style="background:#1e293b;padding:10px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0">';
  html+='<span style="font-size:22px">🔧</span>';
  html+='<div style="flex:1"><div style="color:white;font-weight:700;font-size:16px">Planificador de Taller · Rodi</div>';
  html+='<div style="color:#94a3b8;font-size:11px">Vista diaria · Lunes a Viernes</div></div>';
  html+='<div style="display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:'+(conectado?'#16a34a22':'#dc262622')+'">';
  html+='<div style="width:8px;height:8px;border-radius:50%;background:'+(conectado?'#16a34a':'#dc2626')+';'+(conectado?'animation:pulse 2s infinite':'')+'""></div>';
  html+='<span style="font-size:11px;font-weight:700;color:'+(conectado?'#16a34a':'#dc2626')+'">'+(conectado?'En línea · Sincronizado':'Conectando...')+'</span></div></div>';

  html+='<div style="display:flex;flex:1;overflow:hidden">';

  // Panel izquierdo
  html+='<div style="width:190px;background:white;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;flex-shrink:0">';

  html+='<div style="padding:10px;flex:1;overflow-y:auto">';
  html+='<div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Vehículos</div>';
  html+='<input id="inp-mat" placeholder="Matrícula" onkeydown="if(event.key===\'Enter\')agregarCoche()" style="width:100%;padding:7px 9px;border-radius:7px;border:1.5px solid #e2e8f0;font-size:12px;outline:none;background:#f8fafc"/>';
  html+='<input id="inp-mod" placeholder="Modelo" onkeydown="if(event.key===\'Enter\')agregarCoche()" style="width:100%;padding:7px 9px;border-radius:7px;border:1.5px solid #e2e8f0;font-size:12px;outline:none;background:#f8fafc;margin-top:5px"/>';
  html+='<button onclick="agregarCoche()" style="width:100%;margin-top:6px;padding:7px 0;background:#2563eb;color:white;border:none;border-radius:7px;font-weight:700;font-size:12px;cursor:pointer">+ Añadir</button>';
  html+='<div style="margin-top:8px">';
  if(cochesArr.length===0) html+='<div style="color:#cbd5e1;font-size:11px;text-align:center;padding-top:8px">Sin vehículos</div>';
  cochesArr.forEach(function(c){
    html+='<div style="display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;margin-bottom:4px;background:#f8fafc;border:1px solid #e2e8f0">';
    html+='<div style="width:9px;height:9px;border-radius:50%;background:'+c.color+'"></div>';
    html+='<div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:700;color:#1e293b">'+c.matricula+'</div>';
    html+='<div style="font-size:10px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+c.modelo+'</div></div>';
    html+='<button onclick="eliminarCoche('+c.id+')" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:15px">×</button></div>';
  });
  html+='</div></div></div>';

  // Panel principal
  html+='<div style="flex:1;display:flex;flex-direction:column;overflow:hidden">';
  html+='<div style="background:white;border-bottom:1px solid #e2e8f0;padding:4px 10px;flex-shrink:0;display:flex;align-items:center;gap:6px">';
  html+='<button onclick="cambiarSemana(-1)" style="width:24px;height:24px;border-radius:6px;border:1px solid #e2e8f0;background:white;font-size:13px;cursor:pointer;font-weight:700;flex-shrink:0">‹</button>';
  html+='<div style="font-size:11px;font-weight:700;color:#94a3b8;white-space:nowrap">Sem '+semana+'</div>';
  html+='<button onclick="irAHoy()" style="padding:3px 8px;border-radius:6px;border:1px solid #2563eb;background:#2563eb18;color:#2563eb;font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0;white-space:nowrap">📍 Hoy</button>';
  html+='<div style="display:flex;gap:3px;flex:1;position:relative;z-index:10">';
  dias.forEach(function(dia,di){
    var act=diaActivo===di;
    html+='<button type="button" onclick="setDia('+di+')" style="position:relative;z-index:10;flex:1;padding:5px 2px;border-radius:6px;border:none;cursor:pointer;background:'+(act?'#1e293b':'#f1f5f9')+';color:'+(act?'white':'#64748b')+';font-size:11px;font-weight:700;white-space:nowrap;pointer-events:auto">';
    html+=DIAS[dia.getDay()].slice(0,3)+' '+dia.getDate()+'</button>';
  });
  html+='</div>';
  html+='<button onclick="cambiarSemana(1)" style="width:24px;height:24px;border-radius:6px;border:1px solid #e2e8f0;background:white;font-size:13px;cursor:pointer;font-weight:700;flex-shrink:0">›</button>';
  html+='</div>';

  // Cuadrícula
  html+='<div style="flex:1;overflow:auto;padding:14px">';
  html+='<div style="display:inline-block;min-width:'+(COL+FRANJAS.length*CW)+'px">';
  html+='<div style="display:flex;margin-bottom:4px"><div style="width:'+COL+'px"></div>';
  FRANJAS.forEach(function(f,fi){
    html+='<div style="width:'+CW+'px;flex-shrink:0;text-align:center;font-size:11px;font-weight:700;color:#64748b;padding:5px 0;';
    html+='background:'+(fi%2===0?'#f8fafc':'white')+';border-left:1px solid #e2e8f0;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;';
    html+='border-right:'+(fi===FRANJAS.length-1?'1px solid #e2e8f0':'none')+';';
    html+='border-radius:'+(fi===0?'8px 0 0 8px':fi===FRANJAS.length-1?'0 8px 8px 0':'0')+'">'+f+'</div>';
  });
  html+='</div>';

  MECANICOS.forEach(function(mec){
    html+='<div style="display:flex;margin-bottom:5px">';
    html+='<div style="width:'+COL+'px;flex-shrink:0;display:flex;align-items:center;padding-right:8px">';
    html+='<div style="width:100%;display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;background:'+mec.color+'18;border:1.5px solid '+mec.color+'44">';
    html+='<div style="width:9px;height:9px;border-radius:50%;background:'+mec.color+'"></div>';
    html+='<span style="font-size:11px;font-weight:800;color:'+mec.color+';white-space:nowrap">'+mec.nombre+'</span></div></div>';

    FRANJAS.forEach(function(franja,fi){
      var k=getKey(mec.id,diaActual,franja);
      var asig=asignaciones[k];
      var coche=asig?coches[asig.cocheId]:null;
      var br=fi===0?'8px 0 0 8px':fi===FRANJAS.length-1?'0 8px 8px 0':'0';
      var bleft=fi>0?'none':'1px solid #e2e8f0';

      if(asig&&asig.comida){
        html+='<div oncontextmenu="event.preventDefault();toggleComida('+mec.id+',\''+diaStr+'\',\''+franja+'\')" style="width:'+CW+'px;height:'+CH+'px;flex-shrink:0;border:1px solid #fed7aa;border-left:'+bleft+';border-radius:'+br+';background:#fff7ed;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative" onclick="toggleComida('+mec.id+',\''+diaStr+'\',\''+franja+'\')">';
        html+='<div style="font-size:18px">🍽️</div>';
        html+='<div style="font-size:9px;font-weight:700;color:#ea580c">COMIDA</div>';
        html+='<div style="font-size:8px;color:#fdba74">clic para quitar</div>';
        html+='</div>';
      } else if(asig&&coche){
        var llaveOk=!!asig.llaveRecibida;
        var matOk=!!asig.materialPreparado;
        var vencido=isVencido(asig.entrega);
        // Color fondo: verde si llave recibida, rojo si vencido, normal si nada
        var bgColor= (llaveOk&&matOk) ? '#dcfce7' : llaveOk ? '#fef9c3' : vencido ? '#fee2e2' : coche.color+'15';
        var borderColor= (llaveOk&&matOk) ? '#86efac' : llaveOk ? '#fde047' : vencido ? '#fca5a5' : '#e2e8f0';

        html+='<div draggable="true" ondragstart="onDragStart(event,\''+k+'\')" ondragover="onDragOver(event)" ondrop="onDrop(event,'+mec.id+',\''+diaStr+'\',\''+franja+'\')" onclick="abrirModal('+mec.id+',\''+diaStr+'\',\''+franja+'\')" style="width:'+CW+'px;height:'+CH+'px;flex-shrink:0;border:1.5px solid '+borderColor+';border-left:'+bleft+';border-radius:'+br+';background:'+bgColor+';display:flex;flex-direction:column;padding:5px 6px;position:relative;overflow:hidden;cursor:grab">';

        // Fila 1: matrícula + modelo + llave
        html+='<div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">';
        html+='<div style="font-size:10px;font-weight:800;color:'+coche.color+';text-transform:uppercase">'+coche.matricula+'</div>';
        html+='<div style="font-size:9px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+coche.modelo+'</div>';
        if(asig.llave) html+='<span style="background:'+coche.color+';color:white;border-radius:4px;padding:0 4px;font-size:9px;font-weight:700">🔑'+asig.llave+'</span>';
        html+='</div>';

        // Fila 2: descripción
        html+='<div style="font-size:10px;color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px">'+asig.descripcion+'</div>';

        // Fila tipo vehículo
        if(asig.tipo==='renting'){
          html+='<div style="font-size:8px;color:#7c3aed;font-weight:700;margin-bottom:2px">🏢 '+(asig.rentingEmpresa||'Renting')+'</div>';
        }

        // Fila 3: entrega
        if(asig.entrega){
          html+='<div style="font-size:9px;color:'+(vencido?'#dc2626':'#16a34a')+';font-weight:700;margin-bottom:4px">⏰ '+formatEntrega(asig.entrega)+'</div>';
        }

        // Fila 4: botones
        html+='<div style="display:flex;gap:3px;margin-top:auto">';
        html+='<button onclick="event.stopPropagation();toggleLlave('+mec.id+',\''+diaStr+'\',\''+franja+'\','+llaveOk+')" style="flex:1;padding:2px 0;border-radius:5px;border:none;cursor:pointer;font-size:9px;font-weight:700;background:'+(llaveOk?'#ca8a04':'#e2e8f0')+';color:'+(llaveOk?'white':'#64748b')+'">'+(llaveOk?'🔑 '+(asig.llaveNumero||'')+'  ✓':'🔑 Llave')+'</button>';
        html+='<button onclick="event.stopPropagation();toggleMaterial('+mec.id+',\''+diaStr+'\',\''+franja+'\','+matOk+')" style="flex:1;padding:2px 0;border-radius:5px;border:none;cursor:pointer;font-size:9px;font-weight:700;background:'+(matOk?'#2563eb':'#e2e8f0')+';color:'+(matOk?'white':'#64748b')+'">'+(matOk?'📦 Mat. ✓':'📦 Material')+'</button>';
        html+='</div>';

        // Botón eliminar
        html+='<button onclick="eliminarAsig('+mec.id+',\''+diaStr+'\',\''+franja+'\')" style="position:absolute;top:3px;right:4px;background:none;border:none;color:#cbd5e1;cursor:pointer;font-size:13px;line-height:1;padding:0">×</button>';
        html+='</div>';
      } else {
        html+='<div ondragover="onDragOver(event)" ondrop="onDrop(event,'+mec.id+',\''+diaStr+'\',\''+franja+'\')" style="width:'+CW+'px;height:'+CH+'px;flex-shrink:0;border:1px solid #e2e8f0;border-left:'+bleft+';border-radius:'+br+';background:'+(fi%2===0?'white':'#fafbfc')+';display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:4px">';
        html+='<div onclick="abrirModal('+mec.id+',\''+diaStr+'\',\''+franja+'\')" style="width:100%;flex:1;display:flex;align-items:center;justify-content:center"><span style="color:#dde1e7;font-size:18px;font-weight:300">+</span></div>';
        html+='</div>';
      }
    });
    html+='</div>';
  });
  html+='</div></div></div></div>';

  // Modal
  if(modal){
    var mec=MECANICOS.find(function(m){return m.id==modal.mecId;});
    var now=new Date();
    var defDate=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+'T18:00';
    html+='<div onclick="cerrarModal()" style="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200">';
    html+='<div onclick="event.stopPropagation()" style="background:white;border-radius:16px;padding:24px;width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)">';
    html+='<div style="font-weight:700;font-size:15px;color:#1e293b;margin-bottom:3px">'+(modal.editando?'✏️ Editar trabajo':'Asignar trabajo')+'</div>';
    html+='<div style="font-size:12px;color:#64748b;margin-bottom:16px">'+(mec?mec.nombre:'')+' · '+DIAS[new Date(modal.dateStr+'T12:00:00').getDay()]+' · '+modal.franja+'h</div>';

    html+='<div style="margin-bottom:14px"><div style="font-size:11px;font-weight:700;color:#475569;margin-bottom:7px;text-transform:uppercase">Vehículo</div>';
    if(cochesArr.length===0) html+='<div style="font-size:12px;color:#94a3b8">Añade vehículos primero</div>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
    cochesArr.forEach(function(c){
      var sel=modalCocheId==c.id;
      html+='<button onclick="selCoche('+c.id+')" style="display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;border:2px solid '+(sel?c.color:'#e2e8f0')+';background:'+(sel?c.color+'18':'#f8fafc')+';color:'+(sel?c.color:'#64748b')+';font-weight:700;font-size:12px;cursor:pointer">';
      html+='<span style="width:8px;height:8px;border-radius:50%;background:'+c.color+';display:inline-block"></span>'+c.matricula+' <span style="font-weight:400;opacity:.7">· '+c.modelo+'</span></button>';
    });
    html+='</div></div>';

    // Tipo propiedad
    html+='<div style="font-size:11px;font-weight:700;color:#475569;margin-bottom:5px;text-transform:uppercase">Tipo de vehículo</div>';
    var tipoActual=modalTipo||'particular';
    html+='<div style="display:flex;gap:6px;margin-bottom:10px">';
    html+='<button onclick="setTipo(\'particular\')" style="flex:1;padding:7px 0;border-radius:8px;border:2px solid '+(tipoActual==='particular'?'#2563eb':'#e2e8f0')+';background:'+(tipoActual==='particular'?'#2563eb18':'#f8fafc')+';color:'+(tipoActual==='particular'?'#2563eb':'#64748b')+';font-weight:700;font-size:12px;cursor:pointer">👤 Particular</button>';
    html+='<button onclick="setTipo(\'renting\')" style="flex:1;padding:7px 0;border-radius:8px;border:2px solid '+(tipoActual==='renting'?'#2563eb':'#e2e8f0')+';background:'+(tipoActual==='renting'?'#2563eb18':'#f8fafc')+';color:'+(tipoActual==='renting'?'#2563eb':'#64748b')+';font-weight:700;font-size:12px;cursor:pointer">🏢 Renting</button>';
    html+='</div>';
    if(tipoActual==='renting'){
      html+='<input id="modal-renting" placeholder="Nombre de la empresa de renting" value="'+(modalRentingEmpresa||'')+'" style="width:100%;padding:9px 10px;border-radius:7px;border:1.5px solid #e2e8f0;font-size:13px;outline:none;background:#f8fafc;margin-bottom:14px"/>';
    }

    html+='<div style="font-size:11px;font-weight:700;color:#475569;margin-bottom:5px;text-transform:uppercase">🔑 Nº de Llave</div>';
    html+='<input id="modal-llave" placeholder="Ej: 12, A3, Caja 2..." style="width:100%;padding:9px 10px;border-radius:7px;border:1.5px solid #e2e8f0;font-size:13px;outline:none;background:#f8fafc;margin-bottom:14px"/>';

    html+='<div style="font-size:11px;font-weight:700;color:#475569;margin-bottom:5px;text-transform:uppercase">Tarea</div>';
    html+='<div style="display:flex;gap:6px;margin-bottom:14px">';
    html+='<input id="modal-desc" placeholder="Ej: Cambio aceite, pastillas freno..." style="flex:1;padding:9px 10px;border-radius:7px;border:1.5px solid #e2e8f0;font-size:13px;outline:none;background:#f8fafc"/>';
    html+='<button onclick="marcarComida()" style="padding:9px 12px;background:#f97316;color:white;border:none;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap">🍽️</button>';
    html+='</div>';

    html+='<div style="font-size:11px;font-weight:700;color:#475569;margin-bottom:5px;text-transform:uppercase">📅 Fecha y hora de entrega</div>';
    html+='<input id="modal-entrega" type="datetime-local" value="'+defDate+'" style="width:100%;padding:9px 10px;border-radius:7px;border:1.5px solid #e2e8f0;font-size:13px;outline:none;background:#f8fafc;margin-bottom:16px"/>';

    html+='<div style="display:flex;gap:8px">';
    html+='<button onclick="guardar()" style="flex:1;padding:9px 0;background:#2563eb;color:white;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer">✓ Guardar</button>';
    html+='<button onclick="cerrarModal()" style="flex:1;padding:9px 0;background:#f1f5f9;color:#475569;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer">Cancelar</button>';
    html+='</div></div></div>';
  }

  html+='</div>';
  document.getElementById('app').innerHTML=html;
}
</script>
</body>
</html>
